name: Market Design

# Required baseline runs on each main commit and every pull request.
# Path-scoped workflows may remain as additional specialized checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Market design model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/market-design-mechanism-design-and-incentives/requirements.txt
      - run: PYTHONPATH=projects/market-design-mechanism-design-and-incentives pytest -q projects/market-design-mechanism-design-and-incentives
