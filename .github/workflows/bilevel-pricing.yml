name: Bilevel pricing regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run leader/follower regression tests
        run: python -m unittest discover -s projects/leader-follower-bilevel-pricing -p "test_*.py" -v
